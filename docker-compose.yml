version: '3.8'
services:
  app:
    build: .
    image: cosmo-golden-spin_app:latest
    restart: unless-stopped
    volumes:
      - db-data:/usr/src/app/db
      - exports:/usr/src/app/exports
    environment:
      - NODE_ENV=production
    networks:
      - cosmo-net

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - cosmo-net

volumes:
  db-data:
  exports:

networks:
  cosmo-net:
    driver: bridge
