version: '3.8'
services:
  app:
    build: .
    image: cosmo-golden-spin:latest
    ports:
      - "3000:3000"
    volumes:
      - db-data:/app/db
      - exports:/app/exports
    environment:
      NODE_ENV: production
    restart: unless-stopped
    networks:
      - cosmo-net

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - cosmo-net

volumes:
  db-data:
  exports:

networks:
  cosmo-net:
    driver: bridge
