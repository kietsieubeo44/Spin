<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin - COSMO GOLDEN SPIN</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="header"><div class="brand">COSMO ADMIN</div></header>
  <main class="container">
    <h2>Dashboard</h2>
    <div id="stats"></div>
    <div style="margin-top:12px">
      <button id="exportBtn" class="btn">Export CSV/XLSX</button>
      <button id="resetBtn" class="btn">Reset Event</button>
    </div>
    <h3>Winners</h3>
    <table id="winners" style="width:100%;border-collapse:collapse;color:#fff"></table>
  </main>
  <script>
    async function load(){
      const d = await (await fetch('/api/dashboard')).json();
      document.getElementById('stats').innerHTML = `Total Spins: ${d.totalSpins} | Total Winners: ${d.totalWinners}`;
      const rows = await (await fetch('/api/winners')).json();
      const tbl = document.getElementById('winners'); tbl.innerHTML='';
      const h = document.createElement('tr'); h.innerHTML='<th>Employee ID</th><th>Reward</th><th>Claim Time</th>'; tbl.appendChild(h);
      rows.forEach(r=>{ const tr=document.createElement('tr'); tr.innerHTML=`<td>${r.employee_id}</td><td>${r.reward}</td><td>${r.created_at}</td>`; tbl.appendChild(tr); });
    }
    document.getElementById('exportBtn').addEventListener('click', async ()=>{ const res=await (await fetch('/api/export')).json(); window.open(res.csv); });
    document.getElementById('resetBtn').addEventListener('click', async ()=>{ if (!confirm('Reset event?')) return; await fetch('/api/reset',{method:'POST'}); alert('Reset done'); load(); });
    load();
  </script>
</body>
</html>
