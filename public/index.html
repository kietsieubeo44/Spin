<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050711" />
  <meta name="description" content="COSMO Golden Spin luxury casino kiosk" />
  <title>COSMO Golden Spin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="ambient__shine"></div>
    <div class="stars" id="stars"></div>
    <div class="particles" id="particles"></div>
  </div>

  <main class="kiosk" aria-label="COSMO Golden Spin kiosk">
    <header class="brand-bar" aria-label="Event branding">
      <div class="brand-slot">
        <img class="brand-slot__logo" src="/branding/company-logo.svg" alt="Company Logo" data-fallback="COMPANY LOGO" />
        <span class="brand-slot__fallback">COMPANY LOGO</span>
      </div>
      <div class="brand-title">
        <span class="brand-title__eyebrow">Premium Event Experience</span>
        <h1>COSMO GOLDEN SPIN</h1>
        <span class="brand-title__subline">Luxury Lucky Draw Kiosk</span>
      </div>
      <div class="brand-slot">
        <img class="brand-slot__logo" src="/branding/event-logo.svg" alt="Event Logo" data-fallback="GOLDEN SPIN EVENT" />
        <span class="brand-slot__fallback">GOLDEN SPIN EVENT</span>
      </div>
    </header>

    <section class="machine" aria-label="Golden spin machine">
      <div class="anniversary-badge">
        <img class="anniversary-badge__logo" src="/branding/anniversary-logo.svg" alt="Anniversary Logo" />
        <span>1 YEAR ANNIVERSARY</span>
      </div>

      <div class="wheel-stage">
        <div class="light-ring" id="lightRing" aria-hidden="true"></div>
        <div class="wheel-glow" aria-hidden="true"></div>
        <div class="pointer" aria-hidden="true">
          <div class="pointer__cap"></div>
          <div class="pointer__tip"></div>
        </div>
        <div class="wheel" id="wheelEl">
          <canvas id="wheelCanvas" class="wheel__canvas" width="1600" height="1600" aria-label="Prize wheel"></canvas>
          <div class="wheel__shine" aria-hidden="true"></div>
          <div class="wheel__center" aria-hidden="true">
            <span class="wheel__center-main">FP</span>
            <span class="wheel__center-sub">JACKPOT</span>
          </div>
        </div>
      </div>

      <div class="console">
        <button class="spin-btn" id="spinBtn" type="button">
          <span class="spin-btn__label">SPIN NOW</span>
          <span class="spin-btn__loading">SPINNING</span>
        </button>
        <div class="result" id="resultEl" role="status" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <div class="confetti-container" id="confettiContainer" aria-hidden="true"></div>
  <div class="coin-container" id="coinContainer" aria-hidden="true"></div>

  <section id="idModal" class="modal modal--hidden" role="dialog" aria-modal="true" aria-labelledby="idModalTitle" aria-hidden="true">
    <div class="modal__backdrop" data-close="id"></div>
    <div class="modal__card modal__card--keypad">
      <h2 id="idModalTitle" class="modal__title">Player ID</h2>
      <div class="keypad-display" id="idDisplay" aria-live="polite">Tap ID</div>
      <div class="modal__error" id="idError" role="alert" aria-live="polite"></div>
      <div class="keypad" aria-label="Touchscreen Player ID keypad">
        <button type="button" class="key" data-key="1">1</button>
        <button type="button" class="key" data-key="2">2</button>
        <button type="button" class="key" data-key="3">3</button>
        <button type="button" class="key" data-key="4">4</button>
        <button type="button" class="key" data-key="5">5</button>
        <button type="button" class="key" data-key="6">6</button>
        <button type="button" class="key" data-key="7">7</button>
        <button type="button" class="key" data-key="8">8</button>
        <button type="button" class="key" data-key="9">9</button>
        <button type="button" class="key key--utility" data-action="clear">CLEAR</button>
        <button type="button" class="key" data-key="0">0</button>
        <button type="button" class="key key--utility" data-action="backspace">BACKSPACE</button>
      </div>
      <button type="button" class="confirm-btn" id="idConfirm">CONFIRM</button>
      <button type="button" class="modal-close" id="idCancel">CANCEL</button>
    </div>
  </section>

  <section id="winnerModal" class="modal modal--hidden" role="dialog" aria-modal="true" aria-labelledby="winnerTitle" aria-hidden="true">
    <div class="modal__backdrop"></div>
    <div class="modal__card modal__card--winner">
      <div class="jackpot-burst" aria-hidden="true"></div>
      <p class="winner-kicker">JACKPOT HIT</p>
      <h2 id="winnerTitle" class="modal__title modal__title--winner">YOU WON</h2>
      <div class="reward-reveal" id="winnerPrize" role="status" aria-live="polite">100 FP</div>
      <div class="winner-meta">Player ID <span id="winnerEmployee">-</span></div>
      <button type="button" class="confirm-btn" id="closeWinner">FINISH</button>
    </div>
  </section>

  <script src="/app.js" defer></script>
</body>
</html>
