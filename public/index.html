<!doctype html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Cosmo Golden Spin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

<!-- STARS -->
<div class="stars" id="stars"></div>

<!-- PARTICLES -->
<div class="particles" id="particles"></div>

<div class="frame">

<!-- CORNERS -->
<div class="corner top-left"></div>
<div class="corner top-right"></div>
<div class="corner bottom-left"></div>
<div class="corner bottom-right"></div>

<!-- HEADER -->
<div class="header">

<div class="logo">COSMO</div>

<div class="sub-title">COSMO ANNIVERSARY</div>

<div class="main-title">GOLDEN SPIN</div>

<div class="celebration">CELEBRATION</div>

</div>

<!-- CITY -->
<div class="city city-left">
  <div class="tower t1"></div>
  <div class="tower t2"></div>
  <div class="tower t3"></div>
</div>

<div class="city city-right">
  <div class="tower t1"></div>
  <div class="tower t2"></div>
  <div class="tower t3"></div>
</div>

<!-- WHEEL -->
<div class="wheel-container">
  <div class="wheel-shadow"></div>
  <div class="diamond"></div>
  <div class="pointer"></div>
  <div class="light-ring" id="lightRing"></div>
  <div class="base"></div>
  <div class="wheel">
    <div class="segments" id="segments"></div>
    <div class="center">
      <h1>1</h1>
      <p>YEAR<br>ANNIVERSARY</p>
    </div>
  </div>
</div>

<!-- GIFTS -->
<div class="gifts left-gifts">
  <div class="gift"></div>
  <div class="coins"></div>
</div>

<div class="gifts right-gifts">
  <div class="gift"></div>
  <div class="coins"></div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <button class="spin-btn" id="spinBtn">SPIN NOW</button>
  <div class="result" id="result"></div>
</div>

</div>

<!-- ID Prompt Modal (not permanently visible) -->
<div id="idModal" class="modal hidden">
  <div class="modal-card">
    <h2>Enter Employee ID</h2>
    <p class="small">Please enter your Employee ID to validate before spinning.</p>
    <input id="idInput" placeholder="EMP001" style="padding:10px;border-radius:8px;width:80%;margin-top:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:#fff" />
    <div style="margin-top:10px;display:flex;gap:8px;justify-content:center">
      <button id="idValidate" class="btn">Validate</button>
      <button id="idCancel" class="btn ghost">Cancel</button>
    </div>
    <div id="idError" style="color:#ffb3b3;margin-top:8px;min-height:18px"></div>
  </div>
</div>

<!-- Winner Modal -->
<div id="winnerModal" class="modal hidden">
  <div class="modal-card">
    <h2>🎉 CONGRATULATIONS 🎉</h2>
    <p class="big">YOU WON</p>
    <p id="winnerPrize" class="reward big"></p>
    <div style="margin-top:10px;text-align:left">
      <label for="claimEmployee">Employee ID</label>
      <input id="claimEmployee" placeholder="EMP001" style="padding:10px;border-radius:8px;width:100%;margin-top:6px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:#fff" />
      <div id="claimError" style="color:#ffb3b3;min-height:18px;margin-top:6px"></div>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px;justify-content:center">
      <button id="claimBtn" class="btn gold">CLAIM REWARD</button>
      <button id="closeWinner" class="btn ghost">CLOSE</button>
    </div>
  </div>
</div>

<!-- Success Modal -->
<div id="successModal" class="modal hidden">
  <div class="modal-card success-card">
    <h2>SUCCESS</h2>
    <p>Employee ID: <span id="sEmp"></span></p>
    <p>Reward: <span id="sReward"></span></p>
    <p>Claim Time: <span id="sTime"></span></p>
    <div style="margin-top:12px;display:flex;justify-content:center">
      <button id="closeSuccess" class="btn primary">CLOSE</button>
    </div>
  </div>
</div>

<!-- Confetti container -->
<div id="confetti" class="confetti"></div>

<script src="/app.js"></script>
</body>
</html>
</body>
</html>
