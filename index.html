<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8"/>

<meta
name="viewport"
content="
width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no
"/>

<title>Cosmo Golden Spin</title>

<link
href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Montserrat:wght@300;400;500;700&display=swap"
rel="stylesheet"
/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

min-height:100vh;
overflow:hidden;

display:flex;
justify-content:center;
align-items:center;

font-family:'Montserrat',sans-serif;

background:
radial-gradient(
circle at top,
#1b2954 0%,
#070b19 55%,
#010205 100%
);

position:relative;
}

/* ===== CINEMATIC BLUR ===== */

body::after{

content:'';

position:absolute;
inset:0;

backdrop-filter:blur(1px);

pointer-events:none;
}

/* ===== STARS ===== */

.stars{

position:absolute;
inset:0;
overflow:hidden;
}

.star{

position:absolute;

width:3px;
height:3px;

border-radius:50%;

background:#ffd86a;

box-shadow:
0 0 10px gold,
0 0 20px gold;

animation:
twinkle 3s infinite alternate;
}

@keyframes twinkle{

from{
opacity:.2;
transform:scale(.5);
}

to{
opacity:1;
transform:scale(1.4);
}
}

/* ===== CONFETTI ===== */

.particles{

position:absolute;
inset:0;
overflow:hidden;
}

.particle{

position:absolute;

width:10px;
height:22px;

top:-30px;

animation:
fall 6s linear infinite;
}

@keyframes fall{

from{
transform:
translateY(-100px)
rotate(0deg);
}

to{
transform:
translateY(120vh)
rotate(720deg);
}
}

/* ===== FRAME ===== */

.frame{

position:relative;

width:96%;
height:96vh;

overflow:hidden;

border:3px solid rgba(255,215,0,.5);

box-shadow:
0 0 40px rgba(255,215,0,.2),
inset 0 0 50px rgba(255,215,0,.1);

z-index:10;
}

/* ===== CORNERS ===== */

.corner{

position:absolute;

width:140px;
height:140px;

border:4px solid #f9d878;

z-index:100;
}

.top-left{
top:10px;
left:10px;
border-right:none;
border-bottom:none;
}

.top-right{
top:10px;
right:10px;
border-left:none;
border-bottom:none;
}

.bottom-left{
bottom:10px;
left:10px;
border-right:none;
border-top:none;
}

.bottom-right{
bottom:10px;
right:10px;
border-left:none;
border-top:none;
}

/* ===== HEADER ===== */

.header{

position:relative;

z-index:50;

text-align:center;

padding-top:25px;
}

.logo{

font-family:'Cinzel',serif;

font-size:55px;

color:#fff0b0;

text-shadow:
0 0 10px gold,
0 0 25px gold;
}

.sub-title{

margin-top:5px;

font-family:'Cinzel',serif;

font-size:28px;

letter-spacing:7px;

color:#ffe49d;
}

.main-title{

font-family:'Cinzel',serif;

font-size:110px;
font-weight:900;

line-height:1;

background:
linear-gradient(
to bottom,
#fff8d0 0%,
#ffd86a 25%,
#ffbf00 50%,
#a05e00 75%,
#fff1a7 100%
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

text-shadow:
0 3px 0 #603400,
0 6px 12px rgba(0,0,0,.5),
0 0 30px rgba(255,215,0,.5);
}

.celebration{

font-family:'Cinzel',serif;

font-size:34px;

letter-spacing:5px;

color:#ffe7aa;
}

/* ===== CITY ===== */

.city{

position:absolute;

bottom:0;

width:260px;

display:flex;
align-items:flex-end;
gap:15px;
}

.city-left{
left:60px;
}

.city-right{
right:60px;
transform:scaleX(-1);
}

.tower{

position:relative;

background:
linear-gradient(
to top,
#0d1738,
#1d57a4,
#78e7ff
);

box-shadow:
0 0 20px rgba(0,200,255,.4);
}

.tower::before{

content:'';

position:absolute;
inset:0;

background:
repeating-linear-gradient(
to bottom,
transparent 0,
transparent 8px,
rgba(255,255,255,.25) 9px
);
}

.t1{
width:55px;
height:220px;
}

.t2{
width:70px;
height:360px;
}

.t3{
width:40px;
height:520px;
}

/* ===== WHEEL ===== */

.wheel-container{

position:absolute;

left:50%;
top:56%;

transform:translate(-50%,-50%);

width:850px;
height:850px;
}

/* ===== GLOW ===== */

.wheel-shadow{

position:absolute;
inset:0;

border-radius:50%;

filter:blur(35px);

background:
radial-gradient(
circle,
rgba(255,215,0,.6),
transparent 70%
);

opacity:.8;
}

/* ===== LIGHTS ===== */

.light-ring{

position:absolute;

inset:-25px;

border-radius:50%;

animation:
rotateLights 10s linear infinite;
}

.light{

position:absolute;

width:18px;
height:18px;

border-radius:50%;

background:#ffe27a;

box-shadow:
0 0 10px gold,
0 0 20px gold;
}

@keyframes rotateLights{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}
}

/* ===== POINTER ===== */

.pointer{

position:absolute;

top:-20px;
left:50%;

transform:translateX(-50%);

width:0;
height:0;

border-left:35px solid transparent;
border-right:35px solid transparent;
border-top:80px solid gold;

z-index:1000;

filter:
drop-shadow(0 0 10px gold);
}

.diamond{

position:absolute;

top:75px;
left:50%;

transform:
translateX(-50%)
rotate(45deg);

width:20px;
height:20px;

background:
linear-gradient(
135deg,
#fff6bc,
#ffbf00,
#9c5d00
);

box-shadow:
0 0 20px gold,
0 0 40px gold;

z-index:1000;
}

/* ===== BASE ===== */

.base{

position:absolute;

bottom:-80px;
left:50%;

transform:translateX(-50%);

width:720px;
height:150px;

border-radius:50%;

background:
radial-gradient(
ellipse at center,
#ffe99d,
#c57a00,
#5e3400
);

box-shadow:
0 0 40px rgba(255,215,0,.5);

z-index:-1;
}

/* ===== WHEEL ===== */

.wheel{

width:100%;
height:100%;

border-radius:50%;

overflow:hidden;

position:relative;

border:18px solid #ffdd77;

background:
radial-gradient(
circle,
#462500,
#130700
);

box-shadow:
0 0 40px rgba(255,215,0,.8),
0 0 100px rgba(255,215,0,.4),
inset 0 0 30px rgba(255,255,255,.2);
}

/* ===== SEGMENTS ONLY ROTATE ===== */

.segments{

width:100%;
height:100%;

position:absolute;

border-radius:50%;

transition:
transform 7s cubic-bezier(.17,.67,.15,.99);
}

.segments::after{

content:'';

position:absolute;
inset:0;

background:
linear-gradient(
120deg,
transparent 20%,
rgba(255,255,255,.4) 50%,
transparent 80%
);

animation:
shine 4s linear infinite;
}

@keyframes shine{

from{
transform:translateX(-100%);
}

to{
transform:translateX(100%);
}
}

.segment{

position:absolute;

width:50%;
height:50%;

top:50%;
left:50%;

transform-origin:0% 0%;

clip-path:
polygon(0 0,100% 0,0 100%);

border:
3px solid rgba(255,220,120,.6);
}

.segment span{

position:absolute;

top:28%;
left:10%;

width:170px;

text-align:center;

color:white;

font-size:28px;
font-weight:700;

text-shadow:
0 0 10px rgba(0,0,0,.9);
}

/* ===== CENTER ===== */

.center{

position:absolute;

width:260px;
height:260px;

border-radius:50%;

top:50%;
left:50%;

transform:translate(-50%,-50%);

z-index:100;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

background:
radial-gradient(
circle,
#ffea9c,
#c57a00,
#5a3200
);

border:12px solid #fff0b7;

box-shadow:
0 0 30px gold;
}

.center h1{

font-size:120px;

font-family:'Cinzel',serif;

color:white;
}

.center p{

font-size:24px;

text-align:center;

letter-spacing:3px;

color:#fff0bc;
}

/* ===== GIFTS ===== */

.gifts{

position:absolute;

bottom:20px;
}

.left-gifts{
left:80px;
}

.right-gifts{
right:80px;
}

.gift{

width:110px;
height:110px;

position:relative;

background:
linear-gradient(
to bottom,
#161b42,
#05081f
);

border:2px solid gold;

box-shadow:
0 0 20px rgba(255,215,0,.3);
}

.gift::before{

content:'';

position:absolute;

width:20px;
height:100%;

background:gold;

left:50%;

transform:translateX(-50%);
}

.gift::after{

content:'';

position:absolute;

width:100%;
height:20px;

background:gold;

top:50%;

transform:translateY(-50%);
}

.coins{

width:120px;
height:60px;

margin-top:15px;

border-radius:50%;

background:
repeating-radial-gradient(
circle,
#fff1b0 0,
#c67a00 10px
);

box-shadow:
0 0 20px gold;
}

/* ===== CONTROLS ===== */

.controls{

position:absolute;

left:50%;
bottom:120px;

transform:translateX(-50%);

text-align:center;

z-index:100;
}

.spin-btn{

border:none;

padding:22px 80px;

border-radius:60px;

font-size:28px;
font-weight:700;

cursor:pointer;

background:
linear-gradient(
to bottom,
#fff6bf,
#ffc400,
#9d5e00
);

box-shadow:
0 0 25px rgba(255,215,0,.7);

transition:.3s;
}

.spin-btn:hover{
transform:scale(1.05);
}

.result{

margin-top:20px;

font-size:34px;
font-weight:700;

color:#ffe79d;

min-height:50px;
}

/* ===== RESPONSIVE ===== */

@media(max-width:768px){

.main-title{
font-size:48px;
}

.sub-title{
font-size:18px;
}

.celebration{
font-size:20px;
}

.wheel-container{
width:82vw;
height:82vw;
margin-top:60px;
}

.center{
width:160px;
height:160px;
}

.center h1{
font-size:70px;
}

.center p{
font-size:16px;
}

.segment span{
font-size:12px;
width:70px;
}

.spin-btn{
padding:16px 40px;
font-size:20px;
}

.city{
display:none;
}

.controls{
bottom:80px;
}

.gifts{
display:none;
}

.logo{
font-size:38px;
}
}

</style>
</head>

<body>

<!-- STARS -->
<div class="stars" id="stars"></div>

<!-- PARTICLES -->
<div class="particles" id="particles"></div>

<div class="frame">

<!-- CORNERS -->
<div class="corner top-left"></div>
<div class="corner top-right"></div>
<div class="corner bottom-left"></div>
<div class="corner bottom-right"></div>

<!-- HEADER -->
<div class="header">

<div class="logo">
COSMO
</div>

<div class="sub-title">
COSMO ANNIVERSARY
</div>

<div class="main-title">
GOLDEN SPIN
</div>

<div class="celebration">
CELEBRATION
</div>

</div>

<!-- CITY -->
<div class="city city-left">
<div class="tower t1"></div>
<div class="tower t2"></div>
<div class="tower t3"></div>
</div>

<div class="city city-right">
<div class="tower t1"></div>
<div class="tower t2"></div>
<div class="tower t3"></div>
</div>

<!-- WHEEL -->
<div class="wheel-container">

<div class="wheel-shadow"></div>

<div class="diamond"></div>

<div class="pointer"></div>

<div class="light-ring" id="lightRing"></div>

<div class="base"></div>

<div class="wheel">

<div class="segments" id="segments"></div>

<div class="center">

<h1>1</h1>

<p>
YEAR<br>
ANNIVERSARY
</p>

</div>

</div>

</div>

<!-- GIFTS -->
<div class="gifts left-gifts">
<div class="gift"></div>
<div class="coins"></div>
</div>

<div class="gifts right-gifts">
<div class="gift"></div>
<div class="coins"></div>
</div>

<!-- CONTROLS -->
<div class="controls">

<button
class="spin-btn"
id="spinBtn"
>
SPIN NOW
</button>

<div
class="result"
id="result"
></div>

</div>

</div>

<script>

/* ===== STARS ===== */

const stars =
document.getElementById('stars');

for(let i=0;i<300;i++){

const star =
document.createElement('div');

star.className='star';

star.style.left =
Math.random()*100+'%';

star.style.top =
Math.random()*100+'%';

star.style.animationDelay =
Math.random()*3+'s';

stars.appendChild(star);
}

/* ===== PARTICLES ===== */

const particles =
document.getElementById('particles');

for(let i=0;i<180;i++){

const p =
document.createElement('div');

p.className='particle';

p.style.left =
Math.random()*100+'%';

p.style.animationDelay =
Math.random()*5+'s';

p.style.background =
[
'#ffd700',
'#ff006e',
'#00d4ff',
'#7bff00'
][Math.floor(Math.random()*4)];

particles.appendChild(p);
}

/* ===== LIGHTS ===== */

const lightRing =
document.getElementById('lightRing');

for(let i=0;i<64;i++){

const light =
document.createElement('div');

light.className='light';

const angle =
(360/64)*i;

const radius = 430;

const x =
Math.cos(angle*Math.PI/180)
* radius;

const y =
Math.sin(angle*Math.PI/180)
* radius;

light.style.left =
`calc(50% + ${x}px)`;

light.style.top =
`calc(50% + ${y}px)`;

lightRing.appendChild(light);
}

/* ===== WHEEL ===== */

const rewards = [

"$100 FP",
"$300 FP",
"$500 FP",
"$200 FP",
"$1000 FP",
"$300 FP",
"$100 FP",
"$200 FP",
"$300 FP",
"$500 FP",
"$100 FP",
"$200 FP",
"$2000 FP",
"$100 FP"

];

const colors = [

"#ff006e",
"#2dc653",
"#8338ec",
"#fb5607",
"#3a86ff",
"#38b000"

];

const segments =
document.getElementById('segments');

const angle =
360/rewards.length;

rewards.forEach((reward,index)=>{

const segment =
document.createElement('div');

segment.className='segment';

segment.style.background =
colors[index % colors.length];

segment.style.transform =
`
rotate(${index * angle}deg)
skewY(${90-angle}deg)
`;

const text =
document.createElement('span');

text.innerHTML =
`USD<br>${reward}`;

text.style.transform =
`
skewY(-${90-angle}deg)
rotate(${angle/2}deg)
`;

segment.appendChild(text);

segments.appendChild(segment);

});

/* ===== SPIN ===== */

let currentRotation = 0;

document
.getElementById('spinBtn')
.addEventListener('click',()=>{

const result =
document.getElementById('result');

result.innerHTML='';

const randomIndex =
Math.floor(
Math.random()
* rewards.length
);

const extraSpin =
360 * 8;

const rotateTo =
extraSpin +
(360 - (randomIndex * angle));

currentRotation += rotateTo;

segments.style.transform =
`rotate(${currentRotation}deg)`;

setTimeout(()=>{

result.innerHTML =
`🎉 YOU WON ${rewards[randomIndex]}`;

},7000);

});

</script>

</body>
</html>
